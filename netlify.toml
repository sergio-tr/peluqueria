# Peluquería Nowi — Netlify (Next.js App Router)
# Preview bootstrap: Phase 3A. Production release: Phase 8.
# @netlify/plugin-nextjs manages publish output; do not set publish manually.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# Scheduled function: hourly booking expiration (Phase 2C).
# Scheduled function: daily image retention purge (Phase 5).
# Requires CRON_SECRET and NEXT_PUBLIC_SITE_URL in Netlify env (preview scope).
# Verify in Netlify UI → Functions → expire-bookings / purge-images after first deploy.
