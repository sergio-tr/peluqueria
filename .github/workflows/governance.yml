name: Pull request governance

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate branch name
        run: node .cursor/scripts/validate-branch-name.mjs "${{ github.head_ref }}"

      - name: Validate commit messages
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node .cursor/scripts/validate-commit-range.mjs

      - name: Validate required documentation
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node .cursor/scripts/validate-change-docs.mjs

      - name: Reject tool attribution in PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Reject product attribution only — not filesystem paths like agent-scripts/.
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eiq 'made with[[:space:]]*\[?cursor\]?|co-authored-by:[[:space:]]*cursor\b'; then
            echo "PR metadata contains forbidden tool attribution."
            exit 1
          fi

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
